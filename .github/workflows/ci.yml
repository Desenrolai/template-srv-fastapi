name: CI

# `push` só na branch default; todo o resto é coberto por `pull_request`.
#
# Com `push: ["**"]` e `pull_request` juntos, cada commit de uma branch com PR
# aberto dispara DOIS runs completos do mesmo SHA. O `concurrency` abaixo NÃO
# deduplica: a chave usa `github.ref`, que é `refs/heads/<branch>` no push e
# `refs/pull/<n>/merge` no pull_request — grupos diferentes, zero cancelamento.
# Medido em repo gerado: o mesmo SHA com um run `success` e outro `failure`.
#
# Remover `pull_request` também mataria a duplicação, mas deixaria PR de fork sem
# CI nenhum (o push do fork não dispara no repo base) — e este template é público.
# Fixado por teste: tests/test_ci_wiring.py
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# Push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default mínimo; só o job que publica imagem eleva o próprio escopo.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: desenrolai/${{ github.event.repository.name }}
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint / Format / Typecheck / Test
    # Runner por variável de repositório. Sem `vars.CI_RUNNER` o default é o hosted
    # `ubuntu-latest` — que é o que este template público usa. O valor precisa ser
    # JSON: `'["self-hosted","desenrolai"]'` são DOIS labels; a string
    # `self-hosted,desenrolai` seria UM label só, que nenhum runner atende.
    # Repo privado gerado a partir daqui: ver README → CI.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        # Tag exata: o astral-sh/setup-uv só publica tag móvel de major até v7.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  # Gate de PR: um Dockerfile quebrado precisa reprovar ANTES do merge. Sem login no
  # GHCR e sem `packages: write` — herda o `contents: read` do workflow.
  docker-build:
    name: Docker build (sem push)
    if: ${{ !(github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Tag local: nada é publicado neste job.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Só a branch default publica. Mutuamente exclusivo com o job acima.
  docker-publish:
    name: Docker build + push (GHCR)
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.repository.default_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
